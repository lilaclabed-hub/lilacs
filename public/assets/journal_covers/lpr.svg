<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 240" width="170" height="240">
  <defs>
    <linearGradient id="grad_LPR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#111116" />
    </linearGradient>
    <filter id="shadow_LPR" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Card background -->
  <rect width="170" height="240" rx="6" fill="url(#grad_LPR)" />
  
  <!-- Left book spine highlight -->
  <rect width="7" height="240" rx="2" fill="rgba(255,255,255,0.12)" />
  <line x1="8" y1="0" x2="8" y2="240" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
  
  <!-- Top badge -->
  <rect x="16" y="18" width="52" height="18" rx="3" fill="#a8dadc" />
  <text x="42" y="31" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#1a1a24" text-anchor="middle" letter-spacing="0.05em">LPR</text>
  
  <!-- Accent bar -->
  <rect x="16" y="48" width="138" height="3" rx="1.5" fill="#a8dadc" opacity="0.85" />
  
  <!-- Journal Title -->
  <text x="16" y="88" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff" letter-spacing="-0.02em">Literacy Practice</text>
<text x="16" y="105" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#ffffff" letter-spacing="-0.02em">& Research</text>

  
  <!-- Subtitle / Publisher -->
  <text x="16" y="195" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="9.5" fill="#e0e0e0" opacity="0.9">Keystone State Literacy</text>
<text x="16" y="208" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="9.5" fill="#e0e0e0" opacity="0.9">Association</text>

  
  <!-- Bottom bar with ISSN / Volume -->
  <line x1="16" y1="218" x2="154" y2="218" stroke="rgba(255,255,255,0.2)" stroke-width="0.75" />
  <text x="16" y="229" font-family="ui-monospace, monospace" font-size="7.5" fill="#a8a8b2">ISSN 2577-7424</text>
</svg>